# mvn test                                         -> every scenario, 4 at the same time
# mvn test -Dcucumber.filter.tags="@netflix"       -> one application
# mvn test -Dcucumber.filter.tags="@hybrid"        -> only the UI + API scenarios
# mvn test -Dcucumber.filter.tags="@known-bug"     -> the open defects (red on purpose)
# default filter (pom): "not @known-bug"
# mvn test -Denv=ci                                -> src/test/resources/env/ci.properties
cucumber.glue=com.servet.hybrid
cucumber.plugin=summary, html:target/cucumber-report.html, json:target/cucumber.json
cucumber.publish.quiet=true
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
